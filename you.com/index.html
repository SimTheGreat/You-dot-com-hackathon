<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiveCheck — Real-Time Podcast Fact Detector</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --panel-2: #1b2130;
    --line: #262d3d;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --accent: #6c8cff;
    --true: #2fbf71;
    --false: #ff4d5e;
    --misleading: #ffb02e;
    --unverified: #8b93a7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .logo { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  header .logo span { color: var(--accent); }
  header .tag { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 999px; font-size: 12px;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--unverified); }
  .dot.live { background: var(--false); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: var(--false); border-color: var(--false); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  main { display: flex; flex: 1; min-height: 0; }

  /* ---- Stage (podcast video) ---- */
  .stage { flex: 1.4; display: flex; flex-direction: column; padding: 18px; min-width: 0; }
  .video-wrap {
    position: relative; flex: 1; border-radius: 16px; overflow: hidden;
    background: #000; border: 1px solid var(--line); min-height: 0;
  }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .badge-live {
    position: absolute; top: 14px; left: 14px; z-index: 3;
    background: rgba(255,77,94,.9); color: #fff; font-size: 11px; font-weight: 700;
    padding: 5px 10px; border-radius: 6px; letter-spacing: .05em; display: none;
  }
  .badge-live.on { display: block; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 40px 26px 22px;
    background: linear-gradient(transparent, rgba(0,0,0,.85));
    font-size: 22px; line-height: 1.4; font-weight: 500;
  }
  .caption .final { opacity: .95; }
  .caption .interim { color: var(--muted); }
  .caption.empty { color: var(--muted); font-size: 16px; font-weight: 400; }

  .controls { display: flex; gap: 10px; align-items: center; padding-top: 14px; }
  .controls .spacer { flex: 1; }
  .mode-toggle { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .mode-toggle button {
    border: 0; background: transparent; color: var(--muted); padding: 8px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .mode-toggle button.active { background: var(--accent); color: #fff; }

  /* ---- Feed (fact checks) ---- */
  .feed { flex: 1; border-left: 1px solid var(--line); background: var(--panel);
          display: flex; flex-direction: column; min-width: 340px; max-width: 460px; }
  .feed-head { padding: 16px 18px; border-bottom: 1px solid var(--line);
               display: flex; align-items: center; gap: 10px; }
  .feed-head h2 { margin: 0; font-size: 14px; }
  .feed-head .count { color: var(--muted); font-size: 12px; }
  .scoreboard {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
    padding: 14px 14px 4px;
  }
  .stat {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 4px;
  }
  .stat-num { font-size: 20px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat.true .stat-num { color: var(--true); }
  .stat.false .stat-num { color: var(--false); }
  .stat.misleading .stat-num { color: var(--misleading); }
  .stat.unverified .stat-num { color: var(--unverified); }
  .stat.bump { animation: bump .35s ease; }
  @keyframes bump { 0%{transform:scale(1)} 40%{transform:scale(1.12)} 100%{transform:scale(1)} }

  .cards { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .empty-state { color: var(--muted); text-align: center; margin-top: 40px; font-size: 13px; padding: 0 24px; }

  .card {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; animation: rise .25s ease; border-left: 3px solid var(--line);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .card .claim { font-size: 14px; font-weight: 500; margin-bottom: 10px; line-height: 1.45; }
  .verdict-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .verdict {
    font-size: 11px; font-weight: 800; letter-spacing: .05em;
    padding: 4px 9px; border-radius: 6px; text-transform: uppercase;
  }
  .verdict.TRUE { background: rgba(47,191,113,.16); color: var(--true); }
  .verdict.FALSE { background: rgba(255,77,94,.16); color: var(--false); }
  .verdict.MISLEADING { background: rgba(255,176,46,.16); color: var(--misleading); }
  .verdict.UNVERIFIED { background: rgba(139,147,167,.16); color: var(--unverified); }
  .verdict.CHECKING { background: rgba(108,140,255,.16); color: var(--accent); }
  .card.TRUE { border-left-color: var(--true); }
  .card.FALSE { border-left-color: var(--false); }
  .card.MISLEADING { border-left-color: var(--misleading); }
  .card .explain { color: #cdd3e0; font-size: 13px; margin-bottom: 10px; }
  .card .sources { display: flex; flex-direction: column; gap: 4px; }
  .card .sources a {
    color: var(--accent); text-decoration: none; font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .sources a:hover { text-decoration: underline; }
  .spinner {
    width: 13px; height: 13px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-note { color: var(--false); font-size: 12px; padding: 10px 14px; }
  .hint { color: var(--muted); font-size: 12px; margin-left: 4px; }
</style>
</head>
<body>
<header>
  <div class="logo">Live<span>Check</span></div>
  <div class="tag">Real-time podcast fact detector · powered by You.com</div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="statusDot"></span><span id="statusText">Idle</span></div>
</header>

<main>
  <section class="stage">
    <div class="video-wrap">
      <div class="badge-live" id="liveBadge">● LIVE</div>
      <video id="video" autoplay muted playsinline></video>
      <div class="caption empty" id="caption">Press “Go Live” and start speaking — captions appear here.</div>
    </div>
    <div class="controls">
      <button class="btn primary" id="goBtn">● Go Live</button>
      <button class="btn" id="checkBtn" disabled>Fact-check last sentence</button>
      <div class="spacer"></div>
      <span class="hint">Depth:</span>
      <div class="mode-toggle" id="modeToggle">
        <button data-mode="research" class="active">REST</button>
        <button data-mode="mcp">MCP</button>
        <button data-mode="search">Fast</button>
      </div>
    </div>
  </section>

  <aside class="feed">
    <div class="feed-head">
      <h2>Fact Checks</h2>
      <span class="count" id="feedCount">0</span>
    </div>
    <div class="scoreboard" id="scoreboard">
      <div class="stat" data-k="checked"><span class="stat-num" id="sChecked">0</span><span class="stat-label">Checked</span></div>
      <div class="stat true" data-k="true"><span class="stat-num" id="sTrue">0</span><span class="stat-label">True</span></div>
      <div class="stat false" data-k="false"><span class="stat-num" id="sFalse">0</span><span class="stat-label">False</span></div>
      <div class="stat misleading" data-k="misleading"><span class="stat-num" id="sMisleading">0</span><span class="stat-label">Misleading</span></div>
      <div class="stat unverified" data-k="unverified"><span class="stat-num" id="sUnverified">0</span><span class="stat-label">Unverified</span></div>
    </div>
    <div class="cards" id="cards">
      <div class="empty-state" id="emptyState">
        Detected factual claims will appear here with a verdict and You.com sources.
      </div>
    </div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const video = $("video");
const caption = $("caption");
const cards = $("cards");
let mode = "research";
let recognizing = false;
let recognition = null;
let lastSentence = "";
let checkCount = 0;
const seen = new Set();
const scores = { true: 0, false: 0, misleading: 0, unverified: 0 };

function bumpStat(id) {
  const tile = document.getElementById(id).parentElement;
  tile.classList.remove("bump");
  void tile.offsetWidth; // restart the animation
  tile.classList.add("bump");
}

// ---------- Mode toggle ----------
$("modeToggle").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  mode = b.dataset.mode;
  [...$("modeToggle").children].forEach((c) => c.classList.toggle("active", c === b));
});

// ---------- Webcam (the "podcast video") ----------
async function startVideo() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = stream;
  } catch (e) {
    console.warn("No camera:", e);
    video.style.background = "linear-gradient(135deg,#1b2130,#0b0d12)";
  }
}

// ---------- Speech recognition ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function setStatus(text, live) {
  $("statusText").textContent = text;
  $("statusDot").classList.toggle("live", !!live);
  $("liveBadge").classList.toggle("on", !!live);
}

function initRecognition() {
  if (!SR) {
    alert("This browser doesn't support the Web Speech API. Use Chrome or Edge for the live demo.");
    return null;
  }
  const r = new SR();
  r.continuous = true;
  r.interimResults = true;
  r.lang = "en-US";

  r.onresult = (event) => {
    let interim = "", finalChunk = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalChunk += t;
      else interim += t;
    }
    if (finalChunk) {
      caption.classList.remove("empty");
      caption.innerHTML = `<span class="final">${escapeHtml(finalChunk)}</span>`;
      handleFinal(finalChunk.trim());
    } else if (interim) {
      caption.classList.remove("empty");
      caption.innerHTML = `<span class="interim">${escapeHtml(interim)}</span>`;
    }
  };
  r.onerror = (e) => { if (e.error === "no-speech") return; console.warn("SR error", e.error); };
  r.onend = () => { if (recognizing) r.start(); }; // auto-restart while live
  return r;
}

// Split a finalized chunk into sentences and auto-check the "claim-like" ones.
function handleFinal(text) {
  if (!text) return;
  const sentences = text.split(/(?<=[.!?])\s+/).map((s) => s.trim()).filter(Boolean);
  for (const s of sentences) {
    lastSentence = s;
    $("checkBtn").disabled = false;
    if (looksLikeClaim(s)) autoCheck(s);
  }
  // If no sentence boundary yet, still remember the running text.
  if (sentences.length === 0) { lastSentence = text; $("checkBtn").disabled = false; }
}

// Lightweight claim detector: assertions with numbers, dates, comparatives,
// or "is/was/are" statements that aren't questions.
function looksLikeClaim(s) {
  if (s.length < 18 || s.endsWith("?")) return false;
  const words = s.split(/\s+/).length;
  if (words < 4) return false;
  const patterns = [
    /\d/,                                            // any number / year / stat
    /\b(percent|percentage|million|billion|thousand)\b/i,
    /\b(is|are|was|were|has|have|will|causes?|caused|prevents?|increases?|decreases?|reduces?)\b/i,
    /\b(first|largest|biggest|most|highest|lowest|only|never|always)\b/i,
    /\b(in|since|by)\s+(19|20)\d\d\b/i,
  ];
  return patterns.some((p) => p.test(s));
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- Fact checking ----------
async function autoCheck(claim) {
  const key = claim.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  if (seen.has(key)) return;          // don't re-check the same sentence
  seen.add(key);
  runCheck(claim);
}

async function runCheck(claim) {
  $("emptyState").style.display = "none";
  const card = document.createElement("div");
  card.className = "card CHECKING";
  card.innerHTML = `
    <div class="claim">${escapeHtml(claim)}</div>
    <div class="verdict-row"><span class="spinner"></span>
      <span class="verdict CHECKING">Checking…</span></div>`;
  cards.prepend(card);
  checkCount++; $("feedCount").textContent = checkCount;
  $("sChecked").textContent = checkCount; bumpStat("sChecked");

  try {
    const res = await fetch("/api/factcheck", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ claim, mode }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "request failed");
    renderResult(card, claim, data);
  } catch (e) {
    card.className = "card";
    card.querySelector(".verdict-row").innerHTML =
      `<span class="verdict UNVERIFIED">Error</span>`;
    const note = document.createElement("div");
    note.className = "error-note";
    note.textContent = e.message;
    card.appendChild(note);
  }
}

function renderResult(card, claim, data) {
  const v = (data.verdict || "UNVERIFIED").toUpperCase();
  card.className = "card " + v;
  const tally = { TRUE: ["sTrue", "true"], FALSE: ["sFalse", "false"],
                  MISLEADING: ["sMisleading", "misleading"], UNVERIFIED: ["sUnverified", "unverified"] };
  const [tileId, key] = tally[v] || tally.UNVERIFIED;
  scores[key]++; document.getElementById(tileId).textContent = scores[key]; bumpStat(tileId);
  const sources = (data.sources || [])
    .filter((s) => s.url)
    .map((s) => `<a href="${s.url}" target="_blank" rel="noopener">↗ ${escapeHtml(s.title || s.url)}</a>`)
    .join("");
  card.innerHTML = `
    <div class="claim">${escapeHtml(claim)}</div>
    <div class="verdict-row"><span class="verdict ${v}">${v}</span>
      <span class="hint">${data.mode === "search" ? "web sources" : data.mode === "mcp" ? "via MCP · grounded" : "grounded verdict"}</span></div>
    <div class="explain">${escapeHtml(data.explanation || "")}</div>
    <div class="sources">${sources}</div>`;
}

// ---------- Controls ----------
$("goBtn").addEventListener("click", () => {
  if (!recognizing) {
    recognition = recognition || initRecognition();
    if (!recognition) return;
    recognizing = true;
    recognition.start();
    startVideo();
    setStatus("Live · listening", true);
    $("goBtn").textContent = "■ Stop";
    $("goBtn").classList.replace("primary", "danger");
  } else {
    recognizing = false;
    recognition.stop();
    setStatus("Stopped", false);
    $("goBtn").textContent = "● Go Live";
    $("goBtn").classList.replace("danger", "primary");
  }
});

$("checkBtn").addEventListener("click", () => {
  if (lastSentence) { seen.delete(lastSentence.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim()); autoCheck(lastSentence); }
});
</script>
</body>
</html>
