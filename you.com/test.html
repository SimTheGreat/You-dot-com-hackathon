<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiveCheck — Camera + Speech Test (no API)</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #141821; --panel-2: #1b2130; --line: #262d3d;
    --text: #e8ecf4; --muted: #8b93a7; --accent: #6c8cff; --false: #ff4d5e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .logo { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .tag { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px;
    border-radius: 999px; font-size: 12px; background: var(--panel-2);
    border: 1px solid var(--line); color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--false); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  main { display: flex; flex: 1; min-height: 0; }
  .stage { flex: 1.5; display: flex; flex-direction: column; padding: 18px; min-width: 0; }
  .video-wrap {
    position: relative; flex: 1; border-radius: 16px; overflow: hidden;
    background: #000; border: 1px solid var(--line); min-height: 0;
  }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .badge-live {
    position: absolute; top: 14px; left: 14px; z-index: 3;
    background: rgba(255,77,94,.9); color: #fff; font-size: 11px; font-weight: 700;
    padding: 5px 10px; border-radius: 6px; letter-spacing: .05em; display: none;
  }
  .badge-live.on { display: block; }
  .caption {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 40px 26px 22px; background: linear-gradient(transparent, rgba(0,0,0,.85));
    font-size: 24px; line-height: 1.4; font-weight: 500;
  }
  .caption .final { opacity: .95; }
  .caption .interim { color: var(--muted); }
  .caption.empty { color: var(--muted); font-size: 16px; font-weight: 400; }

  .controls { display: flex; gap: 10px; align-items: center; padding-top: 14px; }
  .btn {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: var(--false); border-color: var(--false); color: #fff; }

  .transcript {
    flex: 1; border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-width: 300px; max-width: 420px;
  }
  .transcript h2 { margin: 0; padding: 16px 18px; font-size: 14px; border-bottom: 1px solid var(--line); }
  .lines { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 8px; }
  .lines .line { font-size: 14px; color: #cdd3e0; border-left: 2px solid var(--line); padding-left: 10px; }
  .empty-state { color: var(--muted); font-size: 13px; text-align: center; margin-top: 40px; padding: 0 20px; }
  .warn { color: var(--false); font-size: 12px; padding: 10px 18px; }
</style>
</head>
<body>
<header>
  <div class="logo">Live<span>Check</span></div>
  <div class="tag">Camera + speech-to-text test · no API</div>
  <div class="spacer"></div>
  <div class="pill"><span class="dot" id="statusDot"></span><span id="statusText">Idle</span></div>
</header>

<main>
  <section class="stage">
    <div class="video-wrap">
      <div class="badge-live" id="liveBadge">● LIVE</div>
      <video id="video" autoplay muted playsinline></video>
      <div class="caption empty" id="caption">Press “Go Live” and start speaking — captions appear here.</div>
    </div>
    <div class="controls">
      <button class="btn primary" id="goBtn">● Go Live</button>
      <button class="btn" id="clearBtn">Clear transcript</button>
      <div class="spacer"></div>
      <span class="tag" id="hint"></span>
    </div>
  </section>

  <aside class="transcript">
    <h2>Transcript</h2>
    <div class="lines" id="lines">
      <div class="empty-state" id="emptyState">Everything you say shows up here, sentence by sentence.</div>
    </div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const video = $("video"), caption = $("caption"), lines = $("lines");
let recognizing = false, recognition = null;

function setStatus(text, live) {
  $("statusText").textContent = text;
  $("statusDot").classList.toggle("live", !!live);
  $("liveBadge").classList.toggle("on", !!live);
}

async function startVideo() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = stream;
  } catch (e) {
    console.warn("No camera:", e);
    video.style.background = "linear-gradient(135deg,#1b2130,#0b0d12)";
  }
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function initRecognition() {
  if (!SR) {
    $("hint").innerHTML = '<span class="warn">Speech API not supported — use Chrome or Edge.</span>';
    return null;
  }
  const r = new SR();
  r.continuous = true; r.interimResults = true; r.lang = "en-US";
  r.onresult = (event) => {
    let interim = "", finalChunk = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalChunk += t; else interim += t;
    }
    if (finalChunk) {
      caption.classList.remove("empty");
      caption.innerHTML = `<span class="final">${escapeHtml(finalChunk)}</span>`;
      addLine(finalChunk.trim());
    } else if (interim) {
      caption.classList.remove("empty");
      caption.innerHTML = `<span class="interim">${escapeHtml(interim)}</span>`;
    }
  };
  r.onerror = (e) => { if (e.error !== "no-speech") console.warn("SR error", e.error); };
  r.onend = () => { if (recognizing) r.start(); };
  return r;
}

function addLine(text) {
  if (!text) return;
  $("emptyState").style.display = "none";
  const div = document.createElement("div");
  div.className = "line";
  div.textContent = text;
  lines.appendChild(div);
  lines.scrollTop = lines.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

$("goBtn").addEventListener("click", () => {
  if (!recognizing) {
    recognition = recognition || initRecognition();
    if (!recognition) return;
    recognizing = true; recognition.start(); startVideo();
    setStatus("Live · listening", true);
    $("goBtn").textContent = "■ Stop";
    $("goBtn").classList.replace("primary", "danger");
  } else {
    recognizing = false; recognition.stop();
    setStatus("Stopped", false);
    $("goBtn").textContent = "● Go Live";
    $("goBtn").classList.replace("danger", "primary");
  }
});

$("clearBtn").addEventListener("click", () => {
  lines.innerHTML = '<div class="empty-state" id="emptyState">Everything you say shows up here, sentence by sentence.</div>';
  caption.classList.add("empty");
  caption.textContent = "Press “Go Live” and start speaking — captions appear here.";
});
</script>
</body>
</html>
